# mcp-wallet server — complete example configuration (config framework v2).
#
# Copy to ./server.yaml (the default path), point SERVER_CONFIG at it, or
# pass --config <path>.
#
# Traefik-style three sources, one unified key space (user ruling
# 2026-05-19):
#
#   built-in defaults  <  config file  <  environment variables  <  CLI flags
#
#   - file:  this YAML.
#   - env:   MPC_ + the upper-cased dotted key, every separator (nesting
#            and any key-internal '_') a single '_'
#            (e.g. MPC_COORD_HTTP_LISTEN=:9000,
#            MPC_COORD_TTL_SKEW_TOLERANCE=30s, MPC_RELAY_PNET_PSK=...).
#            Names are schema-generated and exact-matched, never parsed.
#   - CLI:   --<dotted.key>=<value> (e.g. --coord.http.listen=:9000,
#            --relay.enable=true, --log.level=debug). CLI is highest.
#
# Any value may be a literal OR an "env:VAR" / "file:/path" reference
# (operator's choice; the secret-must-be-a-reference rule is relaxed).
# Putting a real secret as a plaintext literal in a committed file remains
# an operator-owned risk — prefer env:/file: or a CLI flag for secrets.
#
# Startup fails if both relay.enable and coord.enable are false, or a
# required value of an enabled role is missing (fail-fast). The DB-unlock
# passphrase is the absolute exception: it never enters file/env/CLI/KMS —
# only the admin-api interactive unlock provides it (database.md §7).
#
# Values shown are the built-in defaults unless noted. relay and coord may
# run together (one process, dual role) or independently.

log:
  level: info          # debug | info | warn | error
  format: json         # json | text

metrics:
  listen: ":9090"      # health-check + Prometheus metrics; no payload data

# ── relay role ───────────────────────────────────────────────────────────
# Stateless circuit-relay v2 + rendezvous; only forwards ciphertext, never
# terminates Noise, never depends on coord.
relay:
  enable: true
  listen:
    - "/ip4/0.0.0.0/tcp/4001"     # libp2p multiaddrs to listen on
  # pnet PSK (32-byte private-network swarm key): without it a peer cannot
  # speak the protocol and the relay is invisible on the public internet.
  # Literal or env:/file: reference.
  pnet_psk: "env:MPC_RELAY_PNET_PSK"
  token_verify:
    # Authoritative trust anchor: the wallet-group public key set that signs
    # capability tokens (base64). The relay verifies tokens locally against
    # these keys and never depends on coord. Required, non-empty.
    group_pubkeys:
      - "<base64-group-pubkey>"
  rendezvous:
    enable: true                  # same-group member discovery
  limits:                         # anti-DoS quotas
    reservation_per_token: 4
    reservation_per_group: 8
    bandwidth_per_conn: "1MiB/s"
    # Max lifetime of one circuit-v2 relayed link before reset. Empty = the
    # libp2p default 2m, which would cut a proof-enabled keygen short; keep
    # it keygen-aware (security.md invariant #10).
    circuit_max_duration: "10m"

# ── coord role ───────────────────────────────────────────────────────────
# Trust-minimized orchestrator + external-business-service entry. Holds no
# shares, never participates in MPC.
coord:
  enable: true
  http:
    listen: ":8080"               # external-service + member API
  db:
    # SQLite single-file DSN (signing queue / state / group pubkey).
    # Literal or env:/file: reference.
    dsn: "env:MPC_COORD_DB_DSN"
    encryption:
      # Whole-DB encryption at rest (SQLCipher) + LOCKED-until-unlocked
      # lifecycle. MUST stay true in production. Setting false is dev/test
      # only and additionally requires the env ALLOW_INSECURE_DB=1, else the
      # server refuses to start (production iron-law guardrail, unchanged).
      enable: true
  external:
    # External-service auth is fixed api_key (always required, inbound:
    # external -> coord). Result delivery is a fixed address (coord ->
    # external). Outbound callback auth is anti-forgery: set at least one of
    # secret / api_key; when both are set, secret takes precedence.
    #   secret  -> coord signs "<unix>.<raw body>" with HMAC-SHA256, headers
    #              X-MCP-Timestamp + X-MCP-Signature: t=<unix>,v1=<hex>
    #              (preferred: binds the body, replay-resistant)
    #   api_key -> fallback Authorization: Bearer <api_key> (used only when
    #              secret is unset; weaker, no body binding)
    # Outbound result/notify credentials are physically isolated from the
    # inbound api_key (different direction, never reused).
    api_key: "env:MPC_COORD_EXTERNAL_API_KEY"
    result:
      url: "env:MPC_COORD_EXTERNAL_RESULT_URL"          # or a literal https URL
      secret: "env:MPC_COORD_EXTERNAL_RESULT_SECRET"    # HMAC signing key (preferred)
      api_key: "env:MPC_COORD_EXTERNAL_RESULT_API_KEY"  # fallback Bearer token
  notify:
    # Single fixed notification endpoint (flat, not nested): coord only POSTs
    # notification events here; FCM/APNS/etc. are translated and delivered
    # by an external notification channel. coord holds no push credentials.
    # Same dual-mode outbound auth as result (secret preferred, api_key
    # fallback; at least one required).
    url: "env:MPC_COORD_NOTIFY_URL"
    secret: "env:MPC_COORD_NOTIFY_SECRET"
    api_key: "env:MPC_COORD_NOTIFY_API_KEY"
  ttl:
    skew_tolerance: "30s"         # clock-skew tolerance for expiry checks
  quorum:
    signer_select: liveness       # stable | liveness
  dispatch:
    timeout: "120s"               # wait for signing completion after dispatch
