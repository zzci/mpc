<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Trine Signer · TSS MPC 成员客户端</title>
<style>
  html, body { margin: 0; padding: 0; background: #06070A; min-height: 100vh; }
  body { font-family: -apple-system, "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes trineSheetUp {
    from { transform: translateY(20%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  @keyframes trineSpin {
    to { transform: rotate(360deg); }
  }
  @keyframes trineScan {
    0%   { top: 0%;   opacity: 0; }
    10%  { opacity: 1; }
    50%  { top: calc(100% - 2px); opacity: 1; }
    60%  { opacity: 0; }
    100% { top: 0%;   opacity: 0; }
  }
  @keyframes trinePop {
    0%   { transform: scale(0.3); opacity: 0; }
    60%  { transform: scale(1.1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes trinePulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.4); }
  }
  @keyframes trineFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #root > div > div { animation: trineFadeIn .35s ease-out; }
  button { font-family: inherit; }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="theme.jsx"></script>
<script type="text/babel" src="signing-viz.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="screens-tabs.jsx"></script>
<script type="text/babel" src="screens-tabs2.jsx"></script>

<script type="text/babel" src="screens-flows.jsx"></script>
<script type="text/babel" src="screens-init.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
