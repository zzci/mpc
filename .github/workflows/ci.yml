name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history required by the gitleaks secret scan

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check
        run: |
          # Exclude external/tss-lib: vendored, audited, pinned upstream source
          # (incl. generated *.pb.go) — must NOT be reformatted.
          diff="$(gofmt -l . | grep -v '^external/tss-lib/' || true)"
          test -z "$diff" || { echo "gofmt diff:"; echo "$diff"; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.11.4

      - name: Build
        run: go build ./...

      # L1-calibrated verification gate (release merge red-line):
      # -race + -count=1 (no cache) + -timeout=1200s + -p 1 (packages
      # serialized — the calibrated fix for whole-tree -race timeouts, NOT a
      # data race). CGO_ENABLED=1 is mandatory: -race needs cgo and cmd/node
      # links mutecomm/go-sqlcipher/v4 (cgo SQLCipher). The local runner wraps
      # this as `rtk test ...`; rtk is a dev-only PATH shim absent on CI
      # runners, so the raw calibrated invocation is encoded here verbatim.
      - name: Test (calibrated gate)
        run: CGO_ENABLED=1 go test -race -count=1 -timeout=1200s -p 1 ./...

      - name: go.mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vulnerability scan (govulncheck)
        run: ./scripts/ci/govulncheck.sh

      - name: Secret scan (gitleaks)
        run: ./scripts/ci/gitleaks.sh

  docker-e2e:
    # E2E-002 Docker isolated-VM ring (docs/design/testing.md §3.3): the same §3.1
    # ring with every simulated machine in its own container on a real Docker
    # bridge network (no 127.0.0.1 shortcut). Self-managed compose; gated by
    # E2E_DOCKER=1. Docker + compose are preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Bun
        run: ./scripts/ci/install-bun.sh

      - name: E2E install
        working-directory: tests/e2e
        run: bun install --frozen-lockfile

      - name: E2E static gate (lint + typecheck)
        working-directory: tests/e2e
        run: bun run lint && bun run typecheck

      - name: E2E-002 Docker isolated ring
        working-directory: tests/e2e
        run: E2E_DOCKER=1 bun run test:e2e-docker

  gomobile-android:
    # Builds the real Android .aar by delegating to scripts/build-android.sh
    # (GM-001 exclusive — call-only here). internal/mobileapi is pure Go (no
    # cgo SQLCipher), so the pinned NDK clang toolchain suffices for bind.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Android .aar (NDK + gomobile -> scripts/build-android.sh)
        run: ./scripts/ci/setup-android-ndk.sh

      - name: Upload .aar artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: mcpwallet-aar
          path: dist/mobile/mcpwallet.aar
          if-no-files-found: error
          retention-days: 14
